name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Aynı dala arka arkaya push gelirse önceki çalışma iptal edilir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    env:
      # MONGODB_URI ve JWT_SECRET BİLEREK yok.
      #
      # Eskiden buraya sahte değerler konuyordu, çünkü src/lib/db.ts
      # MONGODB_URI'yi modül yüklenirken kontrol ediyordu ve onu import eden
      # 50 dosya yüzünden `next build` hiç başlayamıyordu. PR #20 kontrolü
      # connectToDatabase() içine aldı; ikisi de artık yalnızca çağrıldıkları
      # anda okunuyor (db.ts resolveConnectionString, session.ts getSecretKey).
      #
      # Build veritabanına bağlanmaz — veri çeken tüm sayfalar force-dynamic.
      # Testler de bu değişkenlere ihtiyaç duymaz: vitest.config.ts test
      # ortamına kendi değerlerini enjekte ediyor.
      #
      # Yer tutucuları geri koymak gerekiyorsa, önce bir şeyin onları modül
      # seviyesinde okumaya başladığından şüphelenin.
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # v5: v4 sürümleri GitHub'ın kullanımdan kaldırdığı Node 20 çalışma
      # zamanını hedefliyor ve her çalışmada uyarı üretiyordu. Buradaki sürüm
      # action'ın kendi çalışma zamanı — aşağıdaki node-version'dan bağımsız.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Uygulamanın çalıştığı sürüm: Dockerfile (node:20-alpine) ve README
          # ile aynı kalmalı, yoksa CI üretimden farklı bir Node'da doğrular.
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Mobil uygulama ayrı bir paket: kendi bağımlılıkları, kendi tsconfig'i.
  # Ayrı bir iş olarak koşuyor çünkü web derlemesiyle hiçbir şey paylaşmıyor
  # (ayrı repoya taşınacak). Aksi halde sessizce çürürdü.
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # `expo build` yok: derleme EAS'te bulutta yapılıyor ve hesap gerektiriyor.
      # Burada tip denetimi, kodun tutarlı kaldığını gösteren en güçlü sinyal.
      - name: Type check
        run: npm run typecheck

# `npm run lint` bilerek yok: depoda ESLint yapılandırması bulunmadığı için
# `next lint` kurulum sorusu sorup interaktif moda giriyor ve CI'da takılıyor.
# Lint'i eklemek için önce bir .eslintrc dosyası commit'lenmeli.
